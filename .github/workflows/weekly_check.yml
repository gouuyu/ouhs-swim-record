name: スイムレコード週次チェック

on:
  # 本番の週次自動実行は、パワーシェル＋Windowsタスクスケジューラ側
  # （run_check.ps1、毎週月曜17時、ご自身のPC上で実行）に一本化しています。
  # こちらのGitHub Actions側のスケジュール自動実行（schedule トリガー）は
  # 停止済みです。スイムレコードモバイル側のWAF（SiteGuard）が、GitHub
  # Actionsのクラウドサーバーからのアクセスをブロックしてしまい、毎回失敗
  # していたためです。
  #
  # このworkflow_dispatchは、必要なときに手動で試したい場合のために残して
  # あります（GitHubの「Actions」タブ→本ワークフロー→「Run workflow」）。
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: |
          pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium

      - name: スイムレコードを確認してロスターを更新
        env:
          SWIMRECORD_ID: ${{ secrets.SWIMRECORD_ID }}
          SWIMRECORD_PASSWORD: ${{ secrets.SWIMRECORD_PASSWORD }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          ROSTER_PATH: index.html
        run: python scripts/check_and_update.py

      - name: デバッグ用スクリーンショットを保存（失敗時のみ）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: scripts/debug_screenshots/
          if-no-files-found: ignore

      - name: 変更があればコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "スイムレコードモバイルから記録を自動更新"
          git diff --cached --quiet || git push
